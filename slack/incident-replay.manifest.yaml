display_information:
  name: Incident Replay
  description: Posts the scripted incident as the responders
features:
  bot_user:
    display_name: incident-replay
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - channels:read
      - channels:join
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
